[files]
# Exclude README files from typos checking (they contain multiple languages)
# Exclude bundled-modules directory (contains third-party bundled code)
# Exclude mcp-bridge directory (tool schemas contain glob patterns that trigger false positives)
# Exclude the generated third-party notices and the Inter licence: licence
# texts and copyright holders' names must stay exactly as their authors wrote
# them (typos once "corrected" a name in them).
extend-exclude = [
  "README*.md",
  "**/bundled-modules/**",
  "apps/mcp-bridge/**",
  "apps/browser-extension/THIRD_PARTY_NOTICES.txt",
  "apps/browser-extension/assets/Inter-OFL.txt",
]

[default]
# Commit ids quoted in backticks (REVIEW.md's commit tables) are hex, not
# words: "67ba3d0" read as "ba", "17e7ded" as "ded".
extend-ignore-re = ["`[0-9a-f]{7,40}`"]

[default.extend-words]
# "Infor" is the ERP vendor name (Infor LN) referenced in the DOM Health
# forensic audit — not a typo of "Info"/"Inform".
Infor = "Infor"
# Electronic health record: athenaOne is one, and the DOM Health tests use
# `ehr.example.test` as its stand-in host.
ehr = "ehr"
EHR = "EHR"
# `singularize()`'s own doc comment (extension-network-inspector.ts)
# deliberately shows the WRONG, mangled output a naive trailing-"s" strip
# would produce from "status"/"address" — these are intentionally not real
# words, not typos to correct.
statu = "statu"
addres = "addres"
# wp1-acceptance.test.ts deliberately queries this exact misspelling to
# test the "suggest the closest observed name" fuzzy-match path — the
# comment right next to it already says "// typo".
segmetn = "segmetn"
# The approval gate's flag: whether the prompt may offer "Allow on this
# site" (`rememberable?: boolean` in approval.ts and its callers). An
# identifier, not a misspelling of "memorable".
rememberable = "rememberable"
# "unparseable" is the accepted spelling for a URL that cannot be parsed
# (click-risk.test.ts); it is not a misspelling of "unparsable".
unparseable = "unparseable"
