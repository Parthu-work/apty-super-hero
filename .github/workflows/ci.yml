name: CI

on:
  push:
    branches:
      - main
      - feature-next
    paths-ignore:
      - "*.md"
  pull_request:
    branches:
      - main
      - feature-next
    paths-ignore:
      - "*.md"

jobs:
  ci:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Install Chrome for Puppeteer
        run: node node_modules/puppeteer/install.mjs
        working-directory: packages/browser-runtime

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

      - name: Validate extension manifest
        run: npm run validate:extension

      - name: Architecture boundary check
        run: npm run audit:architecture

      - name: Branding check
        run: npm run audit:branding

      # Not gated on tools/audit-tools.mjs yet: it currently flags a
      # pre-existing duplicate tool name (see DECISIONS.md/PROJECT_PROGRESS.md's
      # Known Limitations) that predates this workflow and needs a deliberate
      # fix, not a CI-red surprise on an unrelated PR. Run `pnpm audit:tools`
      # locally; wire it in here once that's resolved.
