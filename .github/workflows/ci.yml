name: CI

on:
  push:
    branches:
      - main
      - feature-next
    paths-ignore:
      - "*.md"
  pull_request:
    branches:
      - main
      - feature-next
    paths-ignore:
      - "*.md"

jobs:
  ci:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
        with:
          version: 10

      - name: Use Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: lts/*
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Install Chrome for Puppeteer
        run: node node_modules/puppeteer/install.mjs
        working-directory: packages/browser-runtime

      # apps/mcp-bridge is deliberately excluded from the root pnpm workspace
      # (see CLAUDE.md's package architecture note — it's its own pnpm
      # project with its own lockfile). The root `npm run test`/`typecheck`/
      # `build` scripts shell out into it (test:mcp-bridge, etc.), so its
      # deps need their own install or every one of those steps fails.
      - name: Install mcp-bridge dependencies
        run: pnpm install --ignore-workspace
        working-directory: apps/mcp-bridge

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

      - name: Real-browser extension tests
        run: npm run test:e2e

      - name: Validate extension manifest
        run: npm run validate:extension

      - name: Architecture boundary check
        run: npm run audit:architecture

      - name: Branding check
        run: npm run audit:branding

      - name: Tool registry audit
        run: npm run audit:tools

      - name: MCP bridge docs check
        run: npm run check:mcp-bridge-docs

      - name: Dependency vulnerability audit
        run: pnpm audit --prod

      - name: mcp-bridge dependency vulnerability audit
        run: pnpm audit --prod --ignore-workspace
        working-directory: apps/mcp-bridge

      # Informational only for now: ~100 pre-existing unused-export findings
      # across the codebase (mostly packages/ui's re-exported component prop
      # types) mean this isn't clean enough to gate the build on yet. Still
      # runs on every CI build so the finding count is visible and doesn't
      # silently grow unnoticed.
      - name: Unused dependency/export check (informational)
        run: npm run lint:dependencies
        continue-on-error: true
