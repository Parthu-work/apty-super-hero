name: CI

on:
  push:
    branches:
      - main
      - feature-next
    paths-ignore:
      - "*.md"
  pull_request:
    branches:
      - main
      - feature-next
    paths-ignore:
      - "*.md"

jobs:
  ci:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The pnpm version comes from package.json's packageManager field;
      # also passing `version` here makes the action fail.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Use Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Install Chrome for Puppeteer
        run: node node_modules/puppeteer/install.mjs
        working-directory: packages/browser-runtime

      # apps/mcp-bridge is deliberately excluded from the root pnpm workspace
      # (see CLAUDE.md's package architecture note — it's its own pnpm
      # project with its own lockfile). The root `npm run test`/`typecheck`/
      # `build` scripts shell out into it (test:mcp-bridge, etc.), so its
      # deps need their own install or every one of those steps fails.
      - name: Install mcp-bridge dependencies
        run: pnpm install --ignore-workspace
        working-directory: apps/mcp-bridge

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Coverage of security-critical modules
        run: npm run test:coverage

      - name: Build
        run: npm run build

      - name: Real-browser extension tests
        run: npm run test:e2e

      - name: Validate extension manifest
        run: npm run validate:extension

      - name: Architecture boundary check
        run: npm run audit:architecture

      - name: Branding check
        run: npm run audit:branding

      - name: No hard-coded colours or sizes
        run: npm run audit:design-tokens

      - name: Tool registry audit
        run: npm run audit:tools

      - name: MCP bridge docs check
        run: npm run check:mcp-bridge-docs

      - name: Skipped tests say why
        run: npm run audit:test-skips

      - name: No new explicit any
        run: npm run audit:any

      - name: No new hard-coded UI text
        run: npm run audit:i18n

      - name: Markdown links resolve
        run: npm run audit:docs-links

      - name: Third-party notices match the dependencies
        run: npm run audit:notices

      - name: Dependency vulnerability audit
        run: pnpm audit --prod

      - name: mcp-bridge dependency vulnerability audit
        run: pnpm audit --prod --ignore-workspace
        working-directory: apps/mcp-bridge

      # knip --strict: production code only. Exports kept for tests are
      # tagged @internal (see knip.json).
      - name: Unused dependency/export check
        run: npm run lint:dependencies
