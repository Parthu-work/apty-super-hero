name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The pnpm version comes from package.json's packageManager field;
      # also passing `version` here makes the action fail.
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5

      - name: Use Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: lts/*
          cache: pnpm

      - name: Check the tag matches the extension version
        run: node tooling/scripts/check-release-version.mjs "${GITHUB_REF_NAME}"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chrome for Puppeteer
        run: node node_modules/puppeteer/install.mjs
        working-directory: packages/browser-runtime

      - name: Install mcp-bridge dependencies
        run: pnpm install --frozen-lockfile --ignore-workspace
        working-directory: apps/mcp-bridge

      - name: Lint, type check and test
        run: npm run lint && npm run typecheck && npm run test && npm run test:coverage

      - name: Build
        run: npm run build

      - name: Real-browser extension tests
        run: npm run test:e2e

      - name: Validate extension manifest
        run: npm run validate:extension

      # Two packages: the unpacked/enterprise one keeps the manifest `key`
      # that pins the extension ID; the Chrome Web Store rejects a `key`, so
      # its package drops it (the store keeps the listing's own ID).
      - name: Package
        run: |
          name="apty-agent-${GITHUB_REF_NAME}.zip"
          store="apty-agent-${GITHUB_REF_NAME}-webstore.zip"
          (cd apps/browser-extension/dist && zip -qr "../../../${name}" .)
          cp -r apps/browser-extension/dist store-dist
          node -e 'const f="store-dist/manifest.json",fs=require("fs"),m=JSON.parse(fs.readFileSync(f));delete m.key;fs.writeFileSync(f,JSON.stringify(m,null,2))'
          (cd store-dist && zip -qr "../${store}" .)
          sha256sum "${name}" "${store}" > "apty-agent-${GITHUB_REF_NAME}.sha256"
          echo "ASSET=${name}" >> "${GITHUB_ENV}"
          echo "STORE_ASSET=${store}" >> "${GITHUB_ENV}"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" "${ASSET}" "${STORE_ASSET}" \
            "apty-agent-${GITHUB_REF_NAME}.sha256" \
            --title "Apty Agent ${GITHUB_REF_NAME}" \
            --notes "See CHANGELOG.md for what changed. ${ASSET} is for loading unpacked or enterprise policy; ${STORE_ASSET} is for the Chrome Web Store. Verify the downloads with: sha256sum -c apty-agent-${GITHUB_REF_NAME}.sha256"
