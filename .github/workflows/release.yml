name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The pnpm version comes from package.json's packageManager field;
      # also passing `version` here makes the action fail.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Use Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: lts/*
          cache: pnpm

      - name: Check the tag matches the extension version
        run: node tooling/scripts/check-release-version.mjs "${GITHUB_REF_NAME}"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chrome for Puppeteer
        run: node node_modules/puppeteer/install.mjs
        working-directory: packages/browser-runtime

      - name: Install mcp-bridge dependencies
        run: pnpm install --frozen-lockfile --ignore-workspace
        working-directory: apps/mcp-bridge

      - name: Lint, type check and test
        run: npm run lint && npm run typecheck && npm run test

      - name: Build
        run: npm run build

      - name: Real-browser extension tests
        run: npm run test:e2e

      - name: Validate extension manifest
        run: npm run validate:extension

      - name: Package
        run: |
          name="apty-agent-${GITHUB_REF_NAME}.zip"
          (cd apps/browser-extension/dist && zip -qr "../../../${name}" .)
          sha256sum "${name}" > "${name}.sha256"
          echo "ASSET=${name}" >> "${GITHUB_ENV}"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" "${ASSET}" "${ASSET}.sha256" \
            --title "Apty Agent ${GITHUB_REF_NAME}" \
            --notes "See CHANGELOG.md for what changed. Verify the download with: sha256sum -c ${ASSET}.sha256"
