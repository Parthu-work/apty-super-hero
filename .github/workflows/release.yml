name: Release

on:
  push:
    tags:
      - "v*"
  # A dry run builds, tests and packages exactly as a release does and
  # uploads the packages, but never publishes (D3). With dry_run off, a
  # run started from a v* tag publishes like a tag push; from a branch it
  # still cannot publish (there is no tag to release).
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build, test and package only; do not publish"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  # Builds, tests and packages with a read-only token, so a compromised
  # dependency's install script can't push or publish.
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history, so the next steps can tell whether the tag is on main.
          fetch-depth: 0

      # The pnpm version comes from package.json's packageManager field;
      # also passing `version` here makes the action fail.
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5

      - name: Use Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: lts/*
          cache: pnpm

      # A tag releases the tag; a run from a branch checks and names the
      # packages after the manifest's own version.
      - name: Choose the release name
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "RELEASE_NAME=${GITHUB_REF_NAME}" >> "${GITHUB_ENV}"
          else
            version=$(node -p 'require("./apps/browser-extension/manifest.json").version')
            echo "RELEASE_NAME=v${version}" >> "${GITHUB_ENV}"
          fi

      - name: Check the tag matches the extension version
        run: node tooling/scripts/check-release-version.mjs "${RELEASE_NAME}"

      - name: Check the tag's commit is on main
        if: github.ref_type == 'tag'
        run: node tooling/scripts/check-tag-on-main.mjs "${GITHUB_SHA}" origin/main

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chrome for Puppeteer
        run: node node_modules/puppeteer/install.mjs
        working-directory: packages/browser-runtime

      - name: Install mcp-bridge dependencies
        run: pnpm install --frozen-lockfile --ignore-workspace
        working-directory: apps/mcp-bridge

      - name: Format, lint, type check and test
        run: npm run format:check && npm run lint && npm run typecheck && npm run test && npm run test:coverage

      - name: Build
        run: npm run build

      - name: Real-browser extension tests
        run: npm run test:e2e

      - name: Manifest, architecture, branding and tool audits
        run: npm run validate:extension && npm run audit:architecture && npm run audit:branding && npm run audit:tools && npm run check:mcp-bridge-docs && npm run audit:test-skips && npm run audit:any && npm run audit:i18n && npm run audit:docs-links && npm run audit:notices

      - name: Production dependency audit
        run: pnpm audit --prod && (cd apps/mcp-bridge && pnpm audit --prod --ignore-workspace)

      - name: The packaged manifest key yields the pinned Agent ID
        run: node tooling/scripts/check-extension-id.mjs apps/browser-extension/dist/manifest.json

      # Two packages: the unpacked/enterprise one keeps the manifest `key`
      # that pins the extension ID; the Chrome Web Store rejects a `key`, so
      # its package drops it (the store keeps the listing's own ID).
      - name: Package
        run: |
          name="apty-agent-${RELEASE_NAME}.zip"
          store="apty-agent-${RELEASE_NAME}-webstore.zip"
          (cd apps/browser-extension/dist && zip -qr "../../../${name}" .)
          cp -r apps/browser-extension/dist store-dist
          node -e 'const f="store-dist/manifest.json",fs=require("fs"),m=JSON.parse(fs.readFileSync(f));delete m.key;fs.writeFileSync(f,JSON.stringify(m,null,2))'
          node tooling/scripts/check-extension-id.mjs --store store-dist/manifest.json
          (cd store-dist && zip -qr "../${store}" .)
          sha256sum "${name}" "${store}" > "apty-agent-${RELEASE_NAME}.sha256"
          sha256sum -c "apty-agent-${RELEASE_NAME}.sha256"
          mkdir release
          mv "${name}" "${store}" "apty-agent-${RELEASE_NAME}.sha256" release/

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: release/
          if-no-files-found: error

  # Publishes a pushed v* tag, or a run started from a v* tag with dry_run
  # off. A dry run stops after the build job's artifacts.
  publish:
    needs: build
    if: >-
      startsWith(github.ref, 'refs/tags/v') &&
      (github.event_name == 'push' || inputs.dry_run == false)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          name="apty-agent-${GITHUB_REF_NAME}.zip"
          store="apty-agent-${GITHUB_REF_NAME}-webstore.zip"
          sha256sum -c "apty-agent-${GITHUB_REF_NAME}.sha256"
          gh release create "${GITHUB_REF_NAME}" "${name}" "${store}" \
            "apty-agent-${GITHUB_REF_NAME}.sha256" \
            --title "Apty Agent ${GITHUB_REF_NAME}" \
            --notes "See CHANGELOG.md for what changed. ${name} is for loading unpacked or enterprise policy; ${store} is for the Chrome Web Store. Verify the downloads with: sha256sum -c apty-agent-${GITHUB_REF_NAME}.sha256"
